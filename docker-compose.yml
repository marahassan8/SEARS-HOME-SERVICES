services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shs_voice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shs_voice"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/shs_voice
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
